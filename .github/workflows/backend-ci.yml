name: Backend CI

on:
  push:
    branches:
      - main
      - feat/backend-medusa
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  medusa:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sami_shope_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sami_shope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sami_shope_ci
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      STORE_CORS: http://localhost:8080
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8080,http://localhost:9000
      JWT_SECRET: ci-jwt-secret-not-for-production
      COOKIE_SECRET: ci-cookie-secret-not-for-production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm db:migrate

      - name: HTTP integration tests
        run: pnpm test:integration:http

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level critical
