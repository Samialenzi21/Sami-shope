name: Frontend CI

on:
  push:
    branches:
      - feat/frontend-import
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  pull_request:
    paths:
      - frontend/**

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
