name: Import Flutter UI

on:
  push:
    branches:
      - feat/frontend-import
    paths:
      - .github/workflows/import-flutter-ui.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sami-shope
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-import
          path: target
          fetch-depth: 0

      - name: Checkout upstream Flutter UI
        uses: actions/checkout@v4
        with:
          repository: abuanwar072/E-commerce-Complete-Flutter-UI
          ref: master
          path: upstream
          persist-credentials: false

      - name: Import application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/frontend
          mkdir -p target/frontend

          for path in android ios assets lib test analysis_options.yaml pubspec.yaml pubspec.lock .gitignore; do
            if [ -e "upstream/$path" ]; then
              cp -a "upstream/$path" target/frontend/
            fi
          done

          cp upstream/README.md target/frontend/UPSTREAM_README.md
          cat > target/frontend/UPSTREAM.md <<'EOF'
          # Upstream source

          The initial Flutter UI was imported from:
          `abuanwar072/E-commerce-Complete-Flutter-UI` (`master`).

          The imported copy intentionally excludes repository showcase/readme-image assets that are not required by the Flutter application.

          This repository will progressively replace demo data and app behavior with the Sami-shope/Medusa integration.
          EOF

      - name: Commit imported frontend
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "feat(frontend): import Flutter shop UI"
          git push origin HEAD:feat/frontend-import
