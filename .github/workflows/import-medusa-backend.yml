name: Import Medusa Backend

on:
  push:
    branches:
      - feat/backend-medusa-bootstrap
    paths:
      - .github/workflows/import-medusa-backend.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sami-shope
        uses: actions/checkout@v4
        with:
          ref: feat/backend-medusa-bootstrap
          path: target
          fetch-depth: 0

      - name: Checkout official Medusa DTC starter
        uses: actions/checkout@v4
        with:
          repository: medusajs/dtc-starter
          ref: main
          path: upstream
          persist-credentials: false

      - name: Import official backend only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/backend
          mkdir -p target/backend
          cp -a upstream/apps/backend/. target/backend/

          cat > target/backend/UPSTREAM.md <<'EOF'
          # Upstream source

          This backend was bootstrapped from the official Medusa `medusajs/dtc-starter` backend application.

          Only `apps/backend` was imported. The DTC Next.js storefront was intentionally excluded because Sami-shope uses Flutter as its frontend.

          Baseline Medusa version at import: 2.19.0.
          EOF

      - name: Commit imported backend
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No backend changes to commit."
            exit 0
          fi
          git commit -m "feat(backend): import official Medusa 2.19 backend"
          git push origin HEAD:feat/backend-medusa-bootstrap
