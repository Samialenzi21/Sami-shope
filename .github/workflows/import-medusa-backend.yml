name: Import Medusa Backend

on:
  push:
    branches:
      - feat/backend-medusa
    paths:
      - .github/workflows/import-medusa-backend.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sami-shope
        uses: actions/checkout@v4
        with:
          ref: feat/backend-medusa
          path: target
          fetch-depth: 0

      - name: Checkout official Medusa DTC starter
        uses: actions/checkout@v4
        with:
          repository: medusajs/dtc-starter
          ref: main
          path: upstream
          persist-credentials: false

      - name: Import backend application only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/backend
          mkdir -p target/backend
          cp -a upstream/apps/backend/. target/backend/

          cat > target/backend/UPSTREAM.md <<'EOF'
          # Upstream source

          The initial backend application was imported from the official Medusa DTC starter:
          `medusajs/dtc-starter/apps/backend` (`main`).

          Sami-shope keeps this backend as a standalone directory and does not import the starter's Next.js storefront or monorepo wrapper.
          Project-specific behavior must use supported Medusa extension points rather than modifying Medusa core.
          EOF

      - name: Commit imported backend
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No backend changes to commit."
            exit 0
          fi
          git commit -m "feat(backend): import official Medusa 2.19 backend"
          git push origin HEAD:feat/backend-medusa
