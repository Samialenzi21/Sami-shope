name: Refresh Backend pnpm Lockfile

on:
  push:
    branches:
      - feat/backend-medusa
    paths:
      - .github/workflows/refresh-backend-pnpm-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/backend-medusa
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate

      - name: Refresh lockfile
        working-directory: backend
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "chore(backend): refresh pnpm lockfile"
          git pull --rebase origin feat/backend-medusa
          git push origin HEAD:feat/backend-medusa
