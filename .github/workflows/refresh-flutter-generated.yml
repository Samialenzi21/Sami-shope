name: Refresh Flutter Generated Files

on:
  push:
    branches:
      - feat/frontend-import
    paths:
      - .github/workflows/refresh-flutter-generated.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-import
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Refresh generated dependency files
        working-directory: frontend
        run: flutter pub get

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pubspec.lock frontend/analysis_options.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(frontend): refresh Flutter generated files"
          git push origin HEAD:feat/frontend-import
